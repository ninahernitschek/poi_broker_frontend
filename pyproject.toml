[project]
name = "poi_broker-frontend"
version = "3.5.0"
description = "A web application for the POI Broker."
readme = "README.md"
dependencies = [
    "Flask==3.*",
    "itsdangerous==2.*",
    "flask-login==0.6.*",
    "Flask-WTF==1.*",
    "Flask-SQLAlchemy==3.*",
    "Flask-Limiter==3.*",
    "python-dotenv",
    "numpy==2.2.*",
    "astropy==6.*",
    "bokeh==3.*",
    "matplotlib==3.*",
    "timezonefinder[numba]",
    "tzdata",
    "email-validator",
    "huey==3.*"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "pytest-xdist",
    "ruff==0.17.0",
    "pre-commit==4.7.0",
    "pre-commit-hooks==6.0.0",
]

[tool.ruff]
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
# Start with syntax, undefined names, invalid control flow and bad comparisons.
# Styling and unused-import enforcement need a separate legacy-code cleanup.
select = ["E9", "F63", "F7", "F82"]

[tool.coverage.run]
source = ["poi_broker"]
context = "test"

[tool.coverage.html]
show_contexts = true

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
filterwarnings = [
    "ignore::erfa.core.ErfaWarning",
]
