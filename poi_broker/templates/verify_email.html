{% extends 'site.html' %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-4">

        <h3 class="mb-4 text-center">Verify Email</h3>

        <div class="card">
            <div class="card-body">

                <p class="text-center">Click the button below to verify your email address.</p>

                <form data-single-submit method="POST" action="{{ url_for('auth.verify_email_post', token=token) }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <button type="submit" class="btn btn-info btn-lg btn-block">
                        Verify Email
                    </button>
                </form>

            </div>
        </div>

    </div>
</div>
{% endblock %}
